name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Can GitHub reach the demo site?
        run: curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" --max-time 20 https://the-internet.herokuapp.com/login || echo "curl failed or timed out"
      - run: npx playwright test --project=chromium -g "my first test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7